[project]
name = "amphiquantic"
version = "0.1.0"
description = "A python package for molecular modeling."
authors = [{ name = "Grayson Miller", email = "grayson.miller124@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
openff = [
    # PyPI openff-* releases were yanked; install the stack from git (Python 3.12+).
    "openff-utilities @ git+https://github.com/openforcefield/openff-utilities.git@a10fc7967efe21db50ffe4c74b06ed850c5d7082",
    "openff-units @ git+https://github.com/openforcefield/openff-units.git@0.3.2",
    "openff-toolkit @ git+https://github.com/openforcefield/openff-toolkit.git@0.18.1",
    "openff-interchange @ git+https://github.com/openforcefield/openff-interchange.git@v0.5.3",
    "openforcefields @ git+https://github.com/openforcefield/openff-forcefields.git@2024.09.0",
    # git-sourced toolkit/interchange omit runtime deps on PyPI; mirror conda-forge base set
    "networkx",
    "xmltodict",
    "cachetools",
    "cached-property",
    "python-constraint",
    "pydantic",
]
protein = [
    "openmmforcefields>=0.12.0",
    "pdbfixer>=1.9",
]
docking = [
    "rdkit",
    "scipy",
    "gemmi",
    "meeko>=0.5.0",
    "pdbfixer>=1.9",
    "openmm>=8.0",
]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["amphiquantic*"]

[dependency-groups]
dev = [
    "maturin>=1.1,<2.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier_a: fast CI tests (agent_verify default)",
    "tier_b: manual GROMACS / slow validation",
    "rust: requires rustquantic extension",
    "gpu: requires wgpu backend",
    "openff: requires openff-toolkit optional extra",
    "hybrid: requires hybrid CPU+GPU path",
    "pme: PME-enabled tests (slow)",
    "docking: requires --extra docking tools installed",
    "complex: full complex fixtures (slow, tier_b)",
    "slow: skipped by agent_verify --fast",
]
